<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dart Room · Live</title>
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/presentation.css">
</head>
<body class="tv">
  <header>
    <a class="brand" href="/play">DART <span>ROOM</span><i>THE GOOD THROW CLUB</i></a>
    <div class="header-meta">
      <span id="connection">Connecting</span>
      <button id="sound" aria-pressed="false">Sound on</button>
      <button id="fullscreen">Full screen</button>
    </div>
  </header>
  <div id="reconnect" class="reconnect-banner" role="status" aria-live="polite" hidden>
    <strong>Reconnecting…</strong><span></span>
  </div>
  <main id="match"></main>
  <footer>
    <span>GOOD COMPANY. GREAT DARTS.</span>
    <span id="scoring-mode">Manual scoring · Entered darts shown on board</span>
  </footer>
  <script src="/static/board.js"></script>
  <script src="/static/presentation.js"></script>
  <script src="/static/sound.js"></script>
  <script>
    DartRoom.live();
    // TV moments (presentation.js) → offline sounds (sound.js). Muted until someone presses Sound on.
    const SOUND_FOR_MOMENT = {dart: 'dart', turn: 'turn', bust: 'bust', maximum: '180', 'game-shot': 'gameshot'};
    DartSound.attachToggle(document.querySelector('#sound'));
    DartRoom.onMoment(name => { if (SOUND_FOR_MOMENT[name]) DartSound.play(SOUND_FOR_MOMENT[name]); });
  </script>
</body>
</html>
