<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dart Room · Host</title><link rel="stylesheet" href="/static/presentation.css"></head><body class="host"><header><a class="brand" href="/control">DART <span>ROOM</span><i>HOST CONTROLLER</i></a><div class="header-meta"><span id="connection">Connecting</span><a id="display-link" target="_blank" rel="noopener" href="/play">Open display ↗</a></div></header><div id="notice" role="status" aria-live="polite"></div><main class="control-layout"><section class="console"><div class="eyebrow">YOUR NIGHT AT THE OCHE</div><h1>Make it a match.</h1><p class="muted">Throw a dart, then tap where it landed.</p><form id="setup"><div class="form-row"><label>Game<select id="start"><option value="301">301 · A quick round</option><option value="501">501 · The classic</option></select></label><label>Finish<select id="finish"><option value="straight">Straight out</option><option value="double">Double out</option></select></label></div><label>Players<select id="count"><option>2</option><option>3</option><option>4</option></select></label><div id="names"></div><button class="primary" type="submit">Start the match →</button></form><section id="entry" hidden><div class="eyebrow">MANUAL SCORE ENTRY</div><h2 id="prompt"></h2><div id="camera-panel" class="camera-panel" hidden><div class="pending-row"><div id="pending" class="pending" aria-live="polite">Camera: waiting for a dart</div><button id="accept" type="button" class="primary" hidden>Accept</button></div><div class="pending-row"><span id="auto-status" class="muted"></span><button id="auto-pause" type="button">Pause auto-accept</button></div></div><div id="turn-darts" class="turn-darts" aria-label="Darts this turn: tap one to correct it"></div><p id="tap-hint" class="muted">Tap where the dart landed.</p><div id="tap-board" class="tap-board"></div><div class="tap-actions"><button id="miss" type="button">Miss</bu
